name: Validação Business 111
on:
  pull_request:
    types: [opened]
    branches: ['feature/anna-business-connect-111']
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/anna-business-1.2.0-dev.111-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: services/anna-one-business
        run: npm install --no-package-lock
      - name: Testes
        working-directory: services/anna-one-business
        run: npm test
      - name: Sintaxe da interface
        run: |
          for file in app/business/*.js; do node --input-type=module --check < "$file"; done
      - name: Build
        working-directory: services/anna-one-business
        run: npx wrangler deploy --dry-run --outdir /tmp/anna-business-build
