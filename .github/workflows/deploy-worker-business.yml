name: Validar e publicar AnnA Business
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar Worker após testes e migrações autorizadas'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'services/anna-one-business/**'
      - 'app/business/**'
      - '.github/workflows/deploy-worker-business.yml'
permissions:
  contents: read
concurrency:
  group: anna-one-business-worker
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: services/anna-one-business
        run: npm install --no-package-lock
      - working-directory: services/anna-one-business
        run: npm test
      - working-directory: services/anna-one-business
        run: npx wrangler deploy --dry-run --outdir /tmp/anna-business-build
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: services/anna-one-business
        run: npm install --no-package-lock
      - working-directory: services/anna-one-business
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy
