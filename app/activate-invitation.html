<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar convite | AnnA One</title><style>body{font:16px Arial;background:#f3f7fc;color:#173553;margin:0}main{max-width:560px;margin:9vh auto;background:white;border-radius:16px;padding:30px;box-shadow:0 4px 22px #17355316}button{background:#147bd1;color:white;border:0;border-radius:8px;padding:13px 20px;cursor:pointer}button:disabled{opacity:.5}#status{margin-top:16px;white-space:pre-wrap}</style></head><body><main><h1>AnnA One</h1><h2>Ativar convite institucional</h2><p>Entre na sua conta AnnA One e confirme o e-mail antes de ativar este convite.</p><button id="activate" disabled>Ativar convite</button><p id="status" role="status">Verificando sessão…</p></main><script type="module">
const status=document.getElementById("status"),button=document.getElementById("activate");
const token=new URL(location.href).searchParams.get("token");
history.replaceState(null,"",location.pathname);
if(!token||!/^[a-f0-9]{64}$/i.test(token)){status.textContent="Link inválido.";throw Error("invalid token");}
try{
 const sdk=await import("https://esm.sh/@neondatabase/auth@0.5.0-beta?bundle");
 const auth=sdk.createAuthClient("https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth");
 const session=await auth.getSession();
 const user=session?.data?.user||session?.data?.session?.user;
 if(!user){status.textContent="Faça login no Portal AnnA One e abra novamente o link do convite.";throw Error("no session");}
 const getJwt=async()=>{for(const method of ["getJWTToken","getJwtToken","token"]){if(typeof auth[method]==="function"){const r=await auth[method]();const v=typeof r==="string"?r:r?.token||r?.data?.token||r?.data?.jwt;if(typeof v==="string"&&v.split(".").length===3)return v;}}const v=session?.data?.session?.access_token;if(typeof v==="string"&&v.split(".").length===3)return v;throw Error("JWT indisponível");};
 button.disabled=false;status.textContent="Sessão encontrada. Confirme para ativar.";
 button.onclick=async()=>{button.disabled=true;status.textContent="Validando convite…";try{const jwt=await getJwt();const response=await fetch("https://anna-one-auditoria-homolog.elisonborg.workers.dev/v1/invitations/accept",{method:"POST",headers:{"Authorization":"Bearer "+jwt,"Content-Type":"application/json"},body:JSON.stringify({token})});const body=await response.json();status.textContent=response.ok&&body.activated?"Convite ativado. Você já pode acessar o Portal AnnA One.":body.error||"Não foi possível ativar.";if(!response.ok)button.disabled=false;}catch{status.textContent="Falha de autenticação ou conexão.";button.disabled=false;}};
}catch(e){if(e.message!=="no session"&&e.message!=="invalid token")status.textContent="Não foi possível validar a sessão. Tente novamente.";}
</script></body></html>
