<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>Conectar AnnA Classroom | AnnA One</title>
<style>body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f1f7fe;color:#0c2646;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;padding:30px;border:1px solid #dbe6f5;border-top:5px solid #3512a2;border-radius:16px;max-width:440px;text-align:center}h1{font-size:22px}p{line-height:1.6}a{color:#086cf3}</style></head>
<body><main class="card"><h1>AnnA Classroom</h1><p id="status">Conectando sua sessão institucional...</p><p><a href="./">Abrir portal AnnA One</a></p></main>
<script type="module">
const status=document.getElementById("status");
const TRUSTED_ORIGIN="https://anna-classroom.elisonborg.workers.dev";
const authBase="https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth";
const nonce=new URLSearchParams(location.hash.slice(1)).get("nonce");
history.replaceState(null,"",location.pathname);
async function connect(){
 if(!window.opener||!nonce||!/^[a-zA-Z0-9_-]{20,128}$/.test(nonce)){status.textContent="Abra esta conexão a partir do AnnA Classroom.";return;}
 try{
  const {createAuthClient}=await import("https://esm.sh/@neondatabase/auth@0.5.0-beta?bundle");
  const auth=createAuthClient(authBase);
  const session=await auth.getSession();
  if(!(session?.data?.user||session?.data?.session?.user)){status.textContent="Entre primeiro pelo portal AnnA One e tente novamente.";return;}
  let token=session?.data?.session?.access_token;
  if(typeof token!=="string"||token.split(".").length!==3){
   const res=await fetch(authBase+"/token",{credentials:"include",cache:"no-store"});
   if(!res.ok)throw Error("no jwt");
   const data=await res.json();
   token=typeof data==="string"?data:data?.token||data?.data?.token||data?.access_token;
  }
  if(typeof token!=="string"||token.split(".").length!==3)throw Error("no jwt");
  window.opener.postMessage({type:"anna-classroom-auth",nonce,token},TRUSTED_ORIGIN);
  status.textContent="Sessão enviada com segurança. Você pode fechar esta janela.";
  window.close();
 }catch{status.textContent="Não foi possível conectar a sessão. Entre pelo portal e tente novamente.";}
}
connect();
</script></body></html>
