<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA One · Licenças Flow</title><style>body{font:15px system-ui;background:#edf4fc;color:#173b61;max-width:860px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin:12px 0 5px;font-weight:650}input,select{width:100%;padding:10px;box-sizing:border-box}button{background:#0968c9;color:white;padding:11px;border:0;border-radius:8px;margin:12px 7px 0 0;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>AnnA One · Licenças Flow</h1><p><a href="./instituicoes.html">Voltar às instituições</a></p><p id="message">Verificando acesso Master...</p><div id="workspace" hidden><section><h2>Vincular instituição</h2><p>Vínculo exclusivo entre Portal AnnA One e cliente Flow, sem substituição automática.</p><label>Instituição<select id="institution"></select></label><label>Cliente no Flow<select id="client"></select></label><button id="bind">Vincular</button><button id="refresh">Atualizar</button></section><section id="editor" hidden><h2>Configurar licença</h2><p>Bloqueios operacionais ainda não estão ativos.</p><form id="form"><div class="grid"><div><label>Status<select id="status"><option value="draft">Rascunho</option><option value="active">Ativa</option><option value="suspended">Suspensa</option><option value="revoked">Revogada</option></select></label></div><div><label>Plano<input id="plan" value="standard" required pattern="[a-z0-9_-]{1,32}"></label></div><div><label>Início<input id="start" type="datetime-local"></label></div><div><label>Vencimento<input id="end" type="datetime-local"></label></div><div><label>Tolerância offline (horas)<input id="grace" type="number" min="0" max="720" value="72" required></label></div><div><label>Limite de unidades<input id="units" type="number" min="1" placeholder="Sem limite"></label></div><div><label>Limite de dispositivos<input id="devices" type="number" min="1" placeholder="Sem limite"></label></div><div><label>Limite de funcionários<input id="users" type="number" min="1" placeholder="Sem limite"></label></div></div><button type="submit">Salvar licença</button></form></section></div><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://tnvghprwltbziivlxeod.supabase.co','sb_publishable_yI9_7tD4RwGrjolPjiq9vg_oSGpxxFR');
const $=id=>document.getElementById(id),say=s=>$('message').textContent=s;let clients=[],links=[],licenses=[],inst=[];
async function request(method='GET',body){const {data:{session}}=await db.auth.getSession();if(!session?.access_token)throw Error('Sessão expirada');const r=await fetch('https://flow.annaone.com.br/api/master-licenses',{method,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
function choices(el,data){el.replaceChildren(new Option('Selecione',''),...data.map(x=>new Option(x.name,String(x.id))))}
const link=()=>links.find(x=>x.portal_institution_id===$('institution').value);
function date(v){if(!v)return '';const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function selection(){const l=link();$('client').disabled=!!l;$('bind').disabled=!$('institution').value||!!l;$('editor').hidden=!l;if(!l)return;$('client').value=String(l.client_id);const x=licenses.find(x=>Number(x.client_id)===Number(l.client_id));$('status').value=x?.status||'draft';$('plan').value=x?.plan||'standard';$('start').value=date(x?.starts_at);$('end').value=date(x?.expires_at);$('grace').value=x?.offline_grace_hours??72;for(const [f,k] of [['units','max_units'],['devices','max_devices'],['users','max_users']])$(f).value=x?.[k]??''}
async function refresh(){try{const d=await request();clients=d.clients;links=d.links;licenses=d.licenses;const i=$('institution').value,c=$('client').value;choices($('institution'),inst);choices($('client'),clients);$('institution').value=i;$('client').value=c;selection();say('Licenças consultadas.')}catch(e){say(e.message)}}
$('institution').onchange=selection;$('refresh').onclick=refresh;
$('bind').onclick=async()=>{const a=$('institution').value,b=Number($('client').value);if(!a||!b)return say('Selecione instituição e cliente Flow');if(!confirm('Vincular permanentemente a instituição ao cliente Flow '+b+'?'))return;try{await request('POST',{portalInstitutionId:a,clientId:b});await refresh()}catch(e){say(e.message)}};
$('form').onsubmit=async e=>{e.preventDefault();const l=link();if(!l)return;const n=id=>$(id).value?Number($(id).value):null;const a={portalInstitutionId:$('institution').value,clientId:Number(l.client_id),status:$('status').value,plan:$('plan').value,startsAt:$('start').value?new Date($('start').value).toISOString():null,expiresAt:$('end').value?new Date($('end').value).toISOString():null,offlineGraceHours:Number($('grace').value),maxUnits:n('units'),maxDevices:n('devices'),maxUsers:n('users')};try{await request('PUT',a);await refresh();say('Licença salva. Bloqueios ainda desativados.')}catch(e){say(e.message)}};
try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Entre no Portal');const {data:a,error}=await db.from('platform_admins').select('user_id').eq('user_id',user.id).limit(1);if(error||!a?.length)throw Error('Acesso exclusivo Master');const {data:rows,error:err}=await db.from('institutions').select('id,name').order('name');if(err)throw Error('Falha ao consultar instituições');inst=rows||[];$('workspace').hidden=false;await refresh()}catch(e){say(e.message)}
</script></body></html>
