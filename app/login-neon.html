<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA One | Entrar na plataforma</title><link rel="icon" href="../assets/anna-symbol.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#edf4fc;color:#173451;font:15px system-ui,Arial}main{background:#fff;border:1px solid #d7e3ee;border-radius:18px;padding:30px;width:min(100%,440px);box-shadow:0 12px 35px #1232}h1{margin:0 0 8px;color:#105496}p{line-height:1.5;color:#526b83}label{display:block;font-weight:600;margin-top:17px}input{width:100%;padding:12px;margin-top:6px;border:1px solid #bbcee0;border-radius:8px;font:inherit}button{width:100%;border:0;border-radius:8px;padding:12px;margin-top:20px;background:#145b9d;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}a{color:#145b9d}#message{min-height:23px}small{display:block;margin-top:16px;color:#667f95}</style></head>
<body><main><h1>AnnA One</h1><p>Entre com sua conta para acessar a plataforma.</p><form id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="enter" type="submit">Entrar</button></form><p id="message" role="status">Verificando sessão…</p><small>Autenticação Neon Auth. <a href="../">Voltar ao site</a></small></main>
<script type="module">
const message=document.getElementById('message'),button=document.getElementById('enter');
const destination=new URLSearchParams(location.search).get('next')==='master'?'./admin-master-preview.html':'./';
try{
 const {createAuthClient}=await import('https://esm.sh/@neondatabase/auth@0.5.0-beta?bundle');
 const auth=createAuthClient('https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth');
 const existing=await auth.getSession();
 if(existing?.data?.user||existing?.data?.session?.user){location.replace(destination);}
 else{message.textContent='Informe seu e-mail e senha.';}
 document.getElementById('login').addEventListener('submit',async event=>{
  event.preventDefault();button.disabled=true;message.textContent='Autenticando…';
  try{
   const result=await auth.signIn.email({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
   if(result?.error)throw Error('invalid credentials');
   const verified=await auth.getSession();
   if(!verified?.data?.user&&!verified?.data?.session?.user)throw Error('no session');
   location.replace(destination);
  }catch{message.textContent='Não foi possível entrar. Confira suas credenciais e tente novamente.';}
  finally{button.disabled=false;}
 });
}catch{message.textContent='Serviço de autenticação temporariamente indisponível.';button.disabled=true;}
</script></body></html>
