<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA One | Primeiro acesso</title><meta name="theme-color" content="#0c2646"><link rel="icon" href="../assets/anna-symbol.svg"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column;height:100dvh;background:linear-gradient(155deg,#e9f3ff,#f7faff 65%);font:15px system-ui,Arial;color:#173451}.head,.foot{flex:0 0 auto;background:#0c2646;color:#fff;padding:12px clamp(16px,5vw,55px)}.brand{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:24px;font-weight:800}.brand img{width:42px}.brand em{font-style:normal;color:#5db8ff}main{flex:0 1 auto;overflow:auto;width:min(440px,calc(100% - 28px));margin:auto;background:white;border:1px solid #d7e3ee;border-top:5px solid #087cff;border-radius:18px;padding:23px;box-shadow:0 12px 35px #1232}h1{font-size:23px;margin:0 0 9px;color:#123965}p{line-height:1.5}label{display:block;font-weight:700;margin:14px 0 5px}input{width:100%;border:1px solid #bbcee0;border-radius:8px;padding:11px;font:inherit}button{margin-top:17px;width:100%;padding:11px;border:0;border-radius:8px;background:#0870ca;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}a{color:#145b9d}.foot{text-align:center;font-size:11px;line-height:1.5;padding:10px}#status{min-height:22px}@media(max-height:550px){.head,.foot{padding:7px 14px}main{padding:14px}.brand img{width:32px}}</style></head><body><header class="head"><a class="brand" href="../"><img src="../assets/anna-symbol.svg" alt=""><span>AnnA <em>One</em></span></a></header><main><h1 id="title">Primeiro acesso</h1><p id="description">Informe seu e-mail institucional para receber as instruções de definição de senha da conta oficial.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><div id="password-fields" hidden><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="8"><label for="confirm">Confirmar senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="8"></div><button id="submit">Continuar</button></form><p id="status" role="status"></p><a href="./login-neon.html">Voltar ao login oficial</a></main><footer class="foot">AnnA One · Tecnologia e Educação Juntas<br>© 2026 AnnA One. Todos os direitos reservados.</footer><script type="module">
const params=new URLSearchParams(location.search),token=params.get('token'),status=document.getElementById('status'),form=document.getElementById('form'),button=document.getElementById('submit'),email=document.getElementById('email');
if(token){document.getElementById('title').textContent='Definir senha';document.getElementById('description').textContent='Defina uma senha para acessar a plataforma oficial.';email.parentElement.querySelector('label[for=email]').hidden=true;email.hidden=true;email.required=false;document.getElementById('password-fields').hidden=false;document.getElementById('password').required=true;document.getElementById('confirm').required=true;button.textContent='Salvar senha';}
try{
 const {createAuthClient}=await import('https://esm.sh/@neondatabase/auth@0.5.0-beta?bundle');
 const auth=createAuthClient('https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth');
 form.addEventListener('submit',async e=>{
  e.preventDefault();button.disabled=true;status.textContent='Processando…';
  try{
   if(token){
    const pass=document.getElementById('password').value;
    if(pass!==document.getElementById('confirm').value)throw Error('As senhas não coincidem.');
    const result=await auth.resetPassword({newPassword:pass,token});if(result?.error)throw result.error;
    status.textContent='Senha definida. Agora entre pelo login oficial.';form.hidden=true;history.replaceState(null,'',location.pathname);
   }else{
    const result=await auth.requestPasswordReset({email:email.value.trim(),redirectTo:new URL('./password-recovery.html',location.href).origin+new URL('./password-recovery.html',location.href).pathname});
    if(result?.error)throw result.error;
    status.textContent='Se a conta estiver cadastrada, você receberá um e-mail com instruções. Confira também o spam.';
   }
  }catch(error){status.textContent=token?'Não foi possível definir a senha. O link pode ter expirado. Solicite outro.':'Não foi possível solicitar a recuperação agora. Tente novamente mais tarde.';}
  finally{button.disabled=false;}
 });
}catch{status.textContent='Serviço de autenticação indisponível. Tente novamente mais tarde.';button.disabled=true;}
</script></body></html>
