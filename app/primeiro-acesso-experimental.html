<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA One | Primeiro acesso experimental</title><style>body{font:16px system-ui,sans-serif;background:#eef4fb;color:#173b61;margin:0;padding:28px}main{max-width:520px;margin:6vh auto;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 25px #1232}h1{margin-top:0}label{display:block;margin-top:16px;font-weight:650}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border-radius:8px;font:inherit}input{border:1px solid #9eb2c6}button{border:0;background:#1469b9;color:white;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}.note{padding:12px;background:#edf4ff;border-radius:8px}#status{min-height:24px}section{margin-top:22px}small{color:#54687e}</style></head><body><main><h1>AnnA One</h1><p class="note">Ambiente experimental de primeiro acesso, separado do painel principal. A recuperação de senha e a verificação da conta ainda dependem de validação real.</p><section id="request"><h2>Definir ou recuperar senha</h2><form id="requestForm"><label for="email">E-mail da conta</label><input id="email" type="email" autocomplete="email" required><button>Solicitar e-mail de recuperação</button></form></section><section id="reset" hidden><h2>Nova senha</h2><form id="resetForm"><label for="password">Nova senha (mínimo 12 caracteres)</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirmar senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button>Salvar nova senha</button></form></section><p id="status" role="status" aria-live="polite"></p><small>Não compartilhe tokens ou senhas. O token de recuperação é usado somente nesta página.</small></main><script>
'use strict';
const AUTH='https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const token=params.get('token');
const status=msg=>{$('status').textContent=msg};
if(token){$('request').hidden=true;$('reset').hidden=false;history.replaceState(null,'',location.pathname)}else if(params.get('error')){status('O link de recuperação é inválido ou expirou. Solicite um novo.')}
if(location.protocol==='file:'){$('requestForm').querySelector('button').disabled=true;status('Prévia local: para solicitar um e-mail, esta página precisa estar hospedada em uma origem autorizada na Neon.')}
async function send(path,body){const response=await fetch(AUTH+path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});let payload={};try{payload=await response.json()}catch{}if(!response.ok)throw new Error('A solicitação não pôde ser concluída ('+response.status+').');return payload}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;status('Enviando solicitação...');try{await send('/request-password-reset',{email:$('email').value.trim(),redirectTo:location.origin+location.pathname});status('Se a conta permitir recuperação, você receberá instruções por e-mail.')}catch(err){status(err.message+' Confirme se a Neon oferece envio de recuperação nesta configuração.')}finally{b.disabled=false}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();if($('password').value!==$('confirm').value){status('As senhas não coincidem.');return}const b=e.submitter;b.disabled=true;status('Atualizando senha...');try{await send('/reset-password',{token,newPassword:$('password').value});$('resetForm').reset();history.replaceState(null,'',location.pathname);status('Senha atualizada. O login e a verificação de e-mail ainda precisam ser validados separadamente.')}catch(err){status(err.message)}finally{b.disabled=false}});
</script></body></html>
