<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração inicial · AnnA Flow</title><style>*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:16px;background:#edf4fc;color:#193b60;font:15px system-ui}main{width:min(100%,430px);background:white;padding:24px;border-radius:18px;box-shadow:0 12px 36px #1233}h1{font-size:23px;margin:0 0 6px;color:#12559c}p{line-height:1.5;color:#536c85}label{display:block;font-weight:700;margin:12px 0 5px}input,button{font:inherit;width:100%;border-radius:9px;padding:10px}input{border:1px solid #c4d5e9}button{background:#0968c9;color:white;border:0;font-weight:700;margin-top:15px;cursor:pointer}.note{background:#edf5ff;padding:10px;border-radius:9px;font-size:12px}a{color:#1666b9}#message{color:#9d3030}</style></head><body><main><h1>AnnA One / Flow</h1><p>Ativação inicial da Administração Central</p><p class="note">Utilize esta página apenas para criar o primeiro administrador central. Informe a credencial técnica do Render somente aqui. A senha não será enviada pelo chat nem salva no navegador.</p><form id="setup"><label for="email">E-mail do administrador</label><input id="email" type="email" autocomplete="email" required><label for="password">Definir senha (mínimo 14 caracteres)</label><input id="password" type="password" autocomplete="new-password" minlength="14" maxlength="128" required><label for="confirmation">Confirmar senha</label><input id="confirmation" type="password" autocomplete="new-password" minlength="14" maxlength="128" required><label for="token">Credencial técnica de configuração (Render)</label><input id="token" type="password" autocomplete="off" required><button type="submit">Criar primeiro administrador</button></form><p id="message" role="status"></p><a href="/flow-login.html">Voltar ao login</a></main><script src="central-setup.js" defer></script></body></html>
