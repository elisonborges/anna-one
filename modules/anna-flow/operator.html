<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA Flow · Acesso do atendente</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#08182e;color:#f3f7ff;margin:0}header{background:#123657;padding:18px 24px;display:flex;justify-content:space-between}a{color:#8de3f4}main{max-width:800px;margin:25px auto;padding:12px}.card{padding:22px;margin-bottom:15px;border:1px solid #365d7d;background:#152b47;border-radius:16px}h1{font-size:24px;margin:0}label{display:grid;gap:5px;margin:12px 0}input,button,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #5380a6;color:#fff;background:#24476b}button{background:#087cff;border:0;font-weight:700;cursor:pointer;margin:4px}#state{white-space:pre-line}small{color:#c2d3e6}</style></head><body><header><h1>AnnA Flow · Atendente</h1><a href="/">Painel público</a></header><main><section class="card" id="loginView"><h2>Entrar</h2><label>ID do cliente<input id="client" type="number" min="1"></label><label>E-mail<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="login">Entrar</button><p id="message" role="status"></p></section><section class="card" id="workView" hidden><h2>Atendimento por unidade</h2><label>Unidade autorizada<select id="unit"></select></label><label>Serviço<select id="service"></select></label><label>Destino<select id="destination"></select></label><button id="issue">Emitir normal</button><button id="preferential">Emitir preferencial</button><button id="call">Chamar próximo</button><button id="finish">Concluir</button><button id="refresh">Atualizar</button><button id="logout">Sair</button><p id="state" role="status"></p><small>As listas mostram apenas unidades e serviços autorizados para o usuário.</small></section></main><script src="operator.js" defer></script></body></html>
