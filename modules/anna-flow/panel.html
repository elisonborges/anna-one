<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA Flow · Painel por unidade</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--fg)}body[data-theme=escuro]{--bg:#08182e;--card:#152b47;--fg:#f4f9ff;--accent:#34dcca;--border:#395c7b}body[data-theme=claro]{--bg:#edf5ff;--card:#fff;--fg:#133457;--accent:#087cff;--border:#c7d9e9}body[data-theme=acolhedor]{--bg:#192d30;--card:#27464a;--fg:#f7fcf7;--accent:#ffcb5e;--border:#65807a}.shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.1vh;padding:1.3vh 1.2vw;overflow:hidden}.header{display:grid;grid-template-columns:1fr 1.3fr auto;gap:1vw;align-items:center}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(10px,1.1vw,18px);overflow:hidden;min-width:0;min-height:0}.logo{display:flex;gap:10px;align-items:center}.logo img{width:45px;height:45px}.logo strong{display:block;font-size:clamp(20px,2.3vw,32px)}.logo small{font-size:12px;opacity:.75}.clock{text-align:right;font-size:clamp(22px,3.5vw,48px);font-weight:850;font-variant-numeric:tabular-nums}.date{font-size:clamp(10px,1.1vw,15px)}.board{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:minmax(0,1fr) minmax(105px,27%);gap:1vw;min-height:0}.hero{border-color:var(--accent);display:flex;flex-direction:column;justify-content:space-around}.ticket{font-size:clamp(55px,10vw,160px);font-weight:900;line-height:1}.destination{font-size:clamp(20px,3vw,46px);font-weight:850;color:var(--accent)}.title{font-size:clamp(12px,1vw,16px);font-weight:750;opacity:.7;text-transform:uppercase;letter-spacing:.06em}.media{font-size:clamp(23px,3vw,46px);font-weight:800;display:flex;flex-direction:column;justify-content:space-between}.media #message{flex:1;display:grid;place-items:center;text-align:center}.history{display:flex;flex-direction:column;gap:8px}.history .line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:4px 0}.services{display:flex;flex-wrap:wrap;gap:10px;align-content:center}.chip{padding:10px;border:1px solid var(--border);border-radius:9px}.chip b{color:var(--accent)}.footer{font-size:11px;opacity:.65;display:flex;justify-content:space-between}#exit{position:fixed;right:1vw;top:1vh;z-index:5;border:0;background:var(--accent);border-radius:8px;padding:7px 10px;cursor:pointer}body:not(.fullscreen) #exit{display:none}@keyframes flash{50%{box-shadow:inset 0 0 0 8px var(--accent);background:#695021}}.flash{animation:flash .9s 5}@media(prefers-reduced-motion:reduce){.flash{animation:none;outline:5px solid var(--accent)}}@media(max-width:700px){.header{grid-template-columns:1fr 1fr}.header .notice{grid-column:1/-1;grid-row:2}.board{grid-template-columns:1fr 1fr}.ticket{font-size:48px}.destination{font-size:19px}.media{font-size:18px}.card{padding:9px}.clock{font-size:24px}}</style></head><body data-theme="escuro"><button id="exit">Sair da tela cheia</button><div class="shell"><header class="header"><div class="logo"><img src="anna-symbol.svg" alt=""><div><strong>AnnA Flow</strong><small id="unitName">Painel por unidade</small></div></div><div class="card notice"><div class="title">Orientações</div><div id="notice"></div></div><div class="card"><div class="date" id="date"></div><div class="clock" id="clock"></div></div></header><main class="board"><section class="card hero" id="hero"><div class="title">Chamando agora</div><div class="ticket" id="ticket">—</div><div class="destination" id="destination">Aguarde sua chamada</div><div id="service"></div></section><section class="card media"><div class="title">Comunicação institucional</div><div id="message">Bem-vindo!</div></section><section class="card history"><div class="title">Últimas chamadas</div><div id="history"></div></section><section class="card"><div class="title">Filas por serviço</div><div class="services" id="services"></div></section></main><footer class="footer"><span id="status">Conectando...</span><span>AnnA One · Homologação · <button id="fullscreen">Tela cheia</button></span></footer></div><script src="panel.js" defer></script></body></html>
