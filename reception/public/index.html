<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnA Reception</title><style>body{font:16px system-ui;background:#f3f5fa;color:#17213b;margin:0}header{background:#282a72;color:white;padding:18px}main{max-width:650px;margin:24px auto;padding:16px}.box{background:white;border-radius:15px;padding:22px;box-shadow:0 2px 12px #0001;margin-bottom:18px}input,select,textarea,button{box-sizing:border-box;font:inherit;width:100%;padding:13px;margin:7px 0 15px;border-radius:9px;border:1px solid #aeb6c8}button{background:#313c92;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{flex:1}label{display:block;font-weight:600}small,.muted{color:#606e85}.item{border-bottom:1px solid #ddd;padding:10px 0}.code{font-size:30px;letter-spacing:2px;font-weight:bold}#message{padding:10px;font-weight:600}@media print{header,nav,form,#message{display:none!important}main{margin:0}.box{box-shadow:none}}</style></head><body><header><h2>AnnA Reception</h2><small>Controle de Saída Escolar · AnnA One</small></header><main><section id="loginBox" class="box"><h2>Acesso dos funcionários</h2><form id="login"><label>Usuário<input name="login" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="dashboard" hidden><nav><button id="btnApoio">Apoio</button><button id="btnPortaria">Portaria</button><button id="btnHistorico">Histórico</button><button id="logout">Sair</button></nav><p id="user"></p><section id="apoio" class="box" hidden><h2>Nova liberação</h2><p>Confira presencialmente o responsável autorizado.</p><label>Buscar aluno<input id="search" placeholder="Nome do aluno"></label><div id="results"></div><form id="issue" hidden><p id="selected"></p><label>Responsável<select id="responsavel" required></select></label><label>Motivo<textarea id="motivo" required maxlength="500"></textarea></label><label><input id="presencial" type="checkbox" required style="width:auto"> Conferência presencial realizada</label><button>Gerar código</button></form><div id="receipt" hidden><h2>Liberação emitida</h2><p id="code" class="code"></p><p>Apresente este código ao porteiro. Não substitui a conferência presencial.</p><button onclick="print()">Imprimir autorização</button></div></section><section id="portaria" class="box" hidden><h2>Validar saída</h2><form id="lookup"><label>Código<input id="lookupCode" maxlength="12" required></label><button>Consultar</button></form><div id="detail" hidden><div id="fields"></div><form id="confirm"><label><input type="checkbox" id="checked" style="width:auto" required> Conferi presencialmente a identidade do responsável</label><button>Confirmar saída</button></form></div></section><section id="historico" class="box" hidden><h2>Histórico</h2><button id="refresh">Atualizar</button><div id="history"></div></section></section><p id="message" role="status"></p></main><script src="/app.js" defer></script></body></html>
