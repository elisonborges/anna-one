<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar acesso · AnnA One</title><style>body{font-family:system-ui;background:#f0f5fb;color:#142d4d;margin:0;padding:32px 16px}main{max-width:480px;margin:8vh auto;background:white;padding:32px;border-radius:16px;box-shadow:0 10px 35px #102e4d18}label{display:block;margin:20px 0 8px;font-weight:650}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}input{border:1px solid #a7b9cc}button{margin-top:20px;background:#2453a4;color:white;border:0;cursor:pointer}a{color:#2453a4}</style></head><body><main><h1>Ativar acesso</h1><p>Convite de administrador · AnnA Service Desk</p><p>Se você já possui uma conta AnnA Service Desk, sua senha atual será mantida. Para uma conta nova, defina uma senha abaixo.</p><form id="activate"><label for="password">Defina uma senha (mínimo de 12 caracteres)</label><input id="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required><button type="submit">Ativar meu acesso</button></form><p id="status" role="status"></p><a href="login.html">Voltar ao login</a></main><script>const token=new URLSearchParams(location.search).get('token');history.replaceState(null,'',location.pathname);const form=document.getElementById('activate'),status=document.getElementById('status');if(!token||token.length>256){form.hidden=true;status.textContent='Link inválido.';}form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Ativando...';try{const r=await fetch('https://anna-one.onrender.com/api/v1/auth/accept-invitation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('password').value})});if(!r.ok)throw Error('Convite inválido, expirado ou indisponível.');form.hidden=true;status.textContent='Acesso ativado. Entre com o e-mail convidado. Se já possuía conta, utilize sua senha anterior; caso contrário, use a senha definida aqui.';}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});</script></body></html>
