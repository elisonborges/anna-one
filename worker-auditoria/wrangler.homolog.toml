# Configuração isolada de homologação do Portal Master.
# Novo build após correção dos comandos de instalação de dependências no Cloudflare.
name = "anna-one-auditoria-homolog"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
APP_ORIGIN = "https://annaone.com.br"
AUTH_ISSUER = "https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech"
AUTH_JWKS_URL = "https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"
RESEND_FROM_EMAIL = "convites@annaone.com.br"

# Secrets exigidos no Worker de homologação: DATABASE_URL (Neon teste) e RESEND_API_KEY.
# Não configurar DATABASE_URL de produção neste Worker.
