name = "anna-one-auditoria"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
APP_ORIGIN = "https://annaone.com.br"
AUTH_ISSUER = "https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech"
AUTH_JWKS_URL = "https://ep-spring-snow-b6mci3yx.neonauth.c-2.sa-east-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"
